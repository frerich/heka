- name: Provision Hetzner resources
  hosts: localhost
  connection: local
  gather_facts: False
  vars_files:
    - secrets.enc

  tasks:
    - name: Register SSH key
      hcloud_ssh_key:
        api_token: "{{ hcloud_token }}"
        name: admin_ssh_key
        public_key: "{{ deploy_ssh_public_key }}"
      register: ssh_key

    - name: Setup firewall
      hetzner.hcloud.firewall:
        api_token: "{{ hcloud_token }}"
        name: firewall
        rules:
          - description: allow SSH from anywhere
            direction: in
            protocol: tcp
            source_ips:
              - 0.0.0.0/0
              - ::/0
            port: 22
          - description: allow HTTP for Let's Encrypt validation and HTTP->HTTPS redirects
            direction: in
            protocol: tcp
            source_ips:
              - 0.0.0.0/0
              - ::/0
            port: 80
          - description: allow HTTPS from anywhere
            direction: in
            protocol: tcp
            source_ips:
              - 0.0.0.0/0
              - ::/0
            port: 443
        state: present

    - name: Create server
      register: server
      hcloud_server:
        api_token: "{{ hcloud_token }}"
        firewalls:
        - firewall
        name: server
        server_type: cx23
        image: ubuntu-26.04
        location: fsn1
        state: present
        ssh_keys:
          - "{{ ssh_key.hcloud_ssh_key.id }}"

    - name: Create DNS zone
      hetzner.hcloud.zone:
        api_token: "{{ hcloud_token }}"
        mode: primary
        name: idkfa.site
        state: present
        ttl: 10800

    - name: Configure A record for server
      community.dns.hetzner_dns_record:
        hetzner_api_token: '{{ hcloud_token }}'
        state: present
        zone_name: idkfa.site
        type: A
        prefix: heka
        value: "{{ server.hcloud_server.ipv4_address }}"
        ttl: 3600

    - name: Configure AAAA record for server
      community.dns.hetzner_dns_record:
        hetzner_api_token: '{{ hcloud_token }}'
        state: present
        zone_name: idkfa.site
        type: AAAA
        prefix: heka
        value: "{{ server.hcloud_server.ipv6 | replace('/64', '') }}"
        ttl: 3600

    - name: Write server private SSH key to temporary file
      copy:
        dest: "/tmp/server_priv_key"
        mode: "0600"
        content: "{{ deploy_ssh_private_key }}"

    - block:
        - name: Add new server to in-memory inventory
          add_host:
            name: "{{ server.hcloud_server.ipv4_address }}"
            ansible_connection: ssh
            ansible_python_interpreter: /usr/bin/python3.14
            ansible_ssh_private_key_file: "/tmp/server_priv_key"
            ansible_user: root

        - name: Install utilities
          delegate_to: "{{ server.hcloud_server.ipv4_address }}"
          ansible.builtin.apt:
            pkg:
              - fail2ban
              - postgresql-client
              - unattended-upgrades
            update_cache: yes

      always:
        - name: Remove server private SSH key
          file:
            path: "/tmp/server_priv_key"
            state: absent
