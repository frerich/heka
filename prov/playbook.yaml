- name: Provision Hetzner resources
  hosts: localhost
  connection: local
  gather_facts: False
  vars_files:
    - secrets.enc
  vars:
    postgresql_config_dir: /etc/postgresql/18/main

  tasks:
    - name: Register SSH key
      hcloud_ssh_key:
        api_token: "{{ hcloud_token }}"
        name: admin_ssh_key
        public_key: "{{ deploy_ssh_public_key }}"
      register: ssh_key

    - name: Setup firewall
      hetzner.hcloud.firewall:
        api_token: "{{ hcloud_token }}"
        name: firewall
        rules:
          - description: allow SSH from anywhere
            direction: in
            protocol: tcp
            source_ips:
              - 0.0.0.0/0
              - ::/0
            port: 22
          - description: allow HTTP for Let's Encrypt validation and HTTP->HTTPS redirects
            direction: in
            protocol: tcp
            source_ips:
              - 0.0.0.0/0
              - ::/0
            port: 80
          - description: allow HTTPS from anywhere
            direction: in
            protocol: tcp
            source_ips:
              - 0.0.0.0/0
              - ::/0
            port: 443
        state: present

    - name: Create server
      register: server
      hcloud_server:
        api_token: "{{ hcloud_token }}"
        firewalls:
        - firewall
        name: server
        server_type: cx23
        image: ubuntu-26.04
        location: fsn1
        state: present
        ssh_keys:
          - "{{ ssh_key.hcloud_ssh_key.id }}"

    - name: Create DNS zone
      hetzner.hcloud.zone:
        api_token: "{{ hcloud_token }}"
        mode: primary
        name: idkfa.site
        state: present
        ttl: 10800

    - name: Configure A record for server
      community.dns.hetzner_dns_record:
        hetzner_api_token: '{{ hcloud_token }}'
        state: present
        zone_name: idkfa.site
        type: A
        prefix: heka
        value: "{{ server.hcloud_server.ipv4_address }}"
        ttl: 3600

    - name: Configure AAAA record for server
      community.dns.hetzner_dns_record:
        hetzner_api_token: '{{ hcloud_token }}'
        state: present
        zone_name: idkfa.site
        type: AAAA
        prefix: heka
        value: "{{ server.hcloud_server.ipv6 | replace('/64', '') }}"
        ttl: 3600

    - name: Write server private SSH key to temporary file
      copy:
        dest: "/tmp/server_priv_key"
        mode: "0600"
        content: "{{ deploy_ssh_private_key }}"

    - block:
        - name: Add new server to in-memory inventory
          add_host:
            name: "{{ server.hcloud_server.ipv4_address }}"
            ansible_connection: ssh
            ansible_python_interpreter: /usr/bin/python3.14
            ansible_ssh_private_key_file: "/tmp/server_priv_key"
            ansible_user: root

        - name: Register additional public SSH keys
          delegate_to: "{{ server.hcloud_server.ipv4_address }}"
          ansible.builtin.lineinfile:
            path: /root/.ssh/authorized_keys
            line: "{{ item }}"
          loop:
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJrReLOi+JRRLiFRCEfxCV/3fPAFnRo5SBJtYvVfq2Dh frerich@MacBook-Air.fritz.box"

        - name: Install required packages
          delegate_to: "{{ server.hcloud_server.ipv4_address }}"
          ansible.builtin.apt:
            pkg:
              - fail2ban
              - postgresql
              - unattended-upgrades
            update_cache: yes

        - name: Let PostreSQL listen on all addresses
          delegate_to: "{{ server.hcloud_server.ipv4_address }}"
          ansible.builtin.lineinfile:
            path: "{{ postgresql_config_dir }}/postgresql.conf"
            regexp: "^listen_addresses="
            line: "listen_addresses='*'"

        - name: Grant Docker containers access to host PostgreSQL cluster
          delegate_to: "{{ server.hcloud_server.ipv4_address }}"
          ansible.builtin.lineinfile:
            path: "{{ postgresql_config_dir }}/pg_hba.conf"
            line: "host\tall\tall\t172.17.0.0/24\tscram-sha-256"

        - name: Restart PostgreSQL to pick up configuration
          delegate_to: "{{ server.hcloud_server.ipv4_address }}"
          ansible.builtin.systemd_service:
            name: postgresql.service
            state: restarted

        - name: Create PostgreSQL user
          delegate_to: "{{ server.hcloud_server.ipv4_address }}"
          ansible.builtin.shell: psql -d postgres -c "CREATE USER {{ postgres_user }} WITH PASSWORD '{{ postgres_password }}'" || true
          become: true
          become_user: postgres

        - name: Create PostgreSQL database
          delegate_to: "{{ server.hcloud_server.ipv4_address }}"
          ansible.builtin.shell: psql -d postgres -c "CREATE DATABASE {{ postgres_database }} OWNER {{ postgres_user }}" || true
          become: true
          become_user: postgres

      always:
        - name: Remove server private SSH key
          file:
            path: "/tmp/server_priv_key"
            state: absent
