service: heka

image: frerich/heka

servers:
  web:
    - 159.69.181.205

accessories:
  postgres:
    image: postgres:18
    host: 159.69.181.205
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
        - POSTGRES_DATABASE
    directories:
      - data:/var/lib/postgresql

proxy:
  ssl: true
  host: heka.idkfa.site
  app_port: 4000
  healthcheck:
    path: /health
  run:
    options:
      command: ["--tls-staging"]

ssh:
  keys_only: true
  key_data:
    - DEPLOY_PRIVATE_SSH_KEY

registry:
  server: localhost:5555

builder:
  arch: amd64
  cache:
    type: gha

env:
  clear:
    PHX_HOST: heka.idkfa.site
  secret:
    - DATABASE_URL
    - SECRET_KEY_BASE

aliases:
  remote: app exec -q -p -i --reuse "/app/bin/heka remote"
  psql: server exec -q -p -i "psql -h localhost -U heka -d heka"
