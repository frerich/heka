service: heka

image: frerich/heka

servers:
  web:
    - 178.105.198.6

healthcheck:
  port: "4000"
  path: "/health"

proxy:
  ssl: true
  host: heka.idkfa.site

ssh:
  keys_only: true
  key_data:
    - DEPLOY_PRIVATE_SSH_KEY

registry:
  server: localhost:5555

builder:
  arch: amd64
  cache:
    type: gha

env:
  clear:
    DATABASE_URL: postgres://localhost/dummy

  secret:
    - SECRET_KEY_BASE
