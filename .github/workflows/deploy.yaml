name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Ansible
      run: |
        python3 -m venv prov
        prov/bin/pip3 install -r prov/requirements.txt

    - name: Install Bundler
      run: gem install bundler

    - name: Install Kamal
      run: bundle install

    - name: Bootstrap server for Kamal
      env:
        ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      run: bundle exec kamal server bootstrap

    - name: Deploy
      env:
        ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      run: bundle exec kamal deploy
